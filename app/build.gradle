plugins {
    id "com.android.application"
}

android {
    namespace "io.appforshare.storesample"
    compileSdk 36

    defaultConfig {
        applicationId "io.appforshare.storesample"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            // No signingConfig: the AppForShare store signs reviewed APKs itself.
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
